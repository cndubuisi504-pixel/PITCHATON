<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PITCHATON | ICT Hub Pitch Competition</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'neon-lime': '#d3ff01',
            'dark-charcoal': '#1a1a1a',
            'accent-gray': '#4d4d4d',
            'card-bg': '#242424',
            'card-border': '#333333',
          }
        }
      }
    }
  </script>

  <!-- React & Babel for Browser Execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Supabase JS Client -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { background-color: #1a1a1a; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; }
    .glow-effect { box-shadow: 0 0 25px rgba(211, 255, 1, 0.25); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1a1a1a; }
    ::-webkit-scrollbar-thumb { background: #4d4d4d; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- SUPABASE CLIENT INITIALIZATION ---
    let defaultUrl = 'https://gqggririspqrzgzwrbyh.supabase.co';
    let defaultKey =  'sb_publishable_uhJY_OZNWTQ1xmTpOW6scg_ksAfR5rz';

    let supabase = (defaultUrl && defaultKey) 
      ? window.supabase.createClient(defaultUrl, defaultKey) 
      : null;

    const ADMIN_EMAIL = 'contacteihpitchaton@gmail.com';
    function isAdmin(email) {
      if (!email) return false;
      return email.toLowerCase() === ADMIN_EMAIL.toLowerCase() || email.includes('+admin');
    }    // --- MAIN APP COMPONENT ---
    function App() {
      const [view, setView] = useState('home');
      const [user, setUser] = useState(null);
      const [settings, setSettings] = useState(null);
      const [toast, setToast] = useState(null);
      const [isConfigured, setIsConfigured] = useState(!!supabase);

      const showToast = (msg, type = 'info') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3500);
      };

      const initSupabase = (url, key) => {
        try {
          localStorage.setItem('supabase_url', url);
          localStorage.setItem('supabase_key', key);
          supabase = window.supabase.createClient(url, key);
          setIsConfigured(true);
          showToast('Connected to Supabase successfully!', 'success');
          checkAuth();
          fetchSettings();
        } catch (e) {
          showToast('Invalid Supabase Configuration', 'error');
        }
      };

      const checkAuth = async () => {
        if (!supabase) return;
        const { data: { session } } = await supabase.auth.getSession();
        setUser(session?.user || null);
        supabase.auth.onAuthStateChange((_event, session) => {
          setUser(session?.user || null);
        });
      };

      const fetchSettings = async () => {
        if (!supabase) return;
        const { data } = await supabase.from('admin_settings').select('*').single();
        if (data) setSettings(data);
      };

      useEffect(() => {
        if (isConfigured) {
          checkAuth();
          fetchSettings();
        }
      }, [isConfigured]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      if (!isConfigured) {
        return <ConfigModal onSave={initSupabase} />;
      }

      return (
        <div className="min-h-screen flex flex-col justify-between">
          {toast && (
            <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-xl border text-sm font-semibold transition-all ${
              toast.type === 'success' ? 'bg-neon-lime text-dark-charcoal border-neon-lime' :
              toast.type === 'error' ? 'bg-red-500 text-white border-red-600' : 'bg-card-bg text-white border-card-border'
            }`}>
              {toast.msg}
            </div>
          )}

          {/* NAVBAR */}
          <header className="sticky top-0 z-40 bg-dark-charcoal/95 backdrop-blur border-b border-card-border">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              <div 
                onClick={() => setView('home')} 
                className="flex items-center gap-2 cursor-pointer font-black text-xl tracking-wider"
              >
                <div className="w-8 h-8 rounded-lg bg-neon-lime text-dark-charcoal flex items-center justify-center font-black">P</div>
                <span>PITCH<span className="text-neon-lime">ATON</span></span>
              </div>

              <div className="flex items-center gap-2 sm:gap-4 text-xs sm:text-sm font-medium">
                <button onClick={() => setView('home')} className={`px-2 py-1 ${view === 'home' ? 'text-neon-lime' : 'text-gray-400'}`}>Home</button>
                <button onClick={() => setView('leaderboard')} className={`px-2 py-1 ${view === 'leaderboard' ? 'text-neon-lime' : 'text-gray-400'}`}>Leaderboard</button>
                <button onClick={() => setView('news')} className={`px-2 py-1 ${view === 'news' ? 'text-neon-lime' : 'text-gray-400'}`}>News</button>

                {user ? (
                  <>
                    {isAdmin(user.email) ? (
                      <button 
                        onClick={() => setView('admin')} 
                        className="bg-neon-lime/10 border border-neon-lime text-neon-lime px-3 py-1.5 rounded-lg font-bold"
                      >
                        Admin Panel
                      </button>
                    ) : (
                      <>
                        <button 
                          onClick={() => setView('dashboard')} 
                          className={`px-2 py-1 ${view === 'dashboard' ? 'text-neon-lime' : 'text-gray-400'}`}
                        >
                          Dashboard
                        </button>
                        <button 
                          onClick={() => setView('submit')} 
                          className="bg-neon-lime text-dark-charcoal px-3 py-1.5 rounded-lg font-bold"
                        >
                          Submit
                        </button>
                      </>
                    )}
                    <button 
                      onClick={async () => { await supabase.auth.signOut(); setUser(null); setView('home'); }} 
                      className="text-gray-400 hover:text-red-400"
                    >
                      Logout
                    </button>
                  </>
                ) : (
                  <button 
                    onClick={() => setView('auth')} 
                    className="bg-neon-lime text-dark-charcoal px-3 py-1.5 rounded-lg font-bold"
                  >
                    Log In / Sign Up
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* VIEW ROUTER */}
          <main className="flex-1 max-w-7xl mx-auto w-full px-4 py-8">
            {view === 'home' && <HomeView setView={setView} user={user} />}
            {view === 'leaderboard' && <LeaderboardView settings={settings} />}
            {view === 'news' && <NewsView />}
            {view === 'auth' && <AuthView onDone={() => setView(isAdmin(user?.email) ? 'admin' : 'dashboard')} showToast={showToast} />}
            {view === 'submit' && <SubmitView user={user} setView={setView} showToast={showToast} settings={settings} />}
            {view === 'dashboard' && <DashboardView user={user} setView={setView} />}
            {view === 'admin' && <AdminView user={user} showToast={showToast} />}
          </main>

          <footer className="border-t border-card-border bg-card-bg/40 py-6 text-center text-xs text-gray-500">
            PITCHATON &copy; {new Date().getFullYear()} ICT Hub. Admin: {ADMIN_EMAIL}
          </footer>
        </div>
      );
    }

    // --- CONFIG MODAL ---
    function ConfigModal({ onSave }) {
      const [url, setUrl] = useState('');
      const [key, setKey] = useState('');

      return (
        <div className="min-h-screen flex items-center justify-center p-4 bg-dark-charcoal">
          <div className="bg-card-bg border border-card-border p-6 rounded-2xl w-full max-w-md shadow-2xl space-y-4">
            <h2 className="text-xl font-bold text-white flex items-center gap-2">
              <span className="w-3 h-3 rounded-full bg-neon-lime inline-block"></span>
              Connect Supabase
            </h2>
            <p className="text-xs text-gray-400">
              Enter your Project URL and Anon Public Key from Supabase Dashboard (Settings &rarr; API).
            </p>
            <div>
              <label className="text-xs font-semibold text-gray-400">Project URL</label>
              <input 
                type="text" 
                placeholder="https://xyz.supabase.co" 
                value={url} 
                onChange={e => setUrl(e.target.value.trim())}
                className="w-full bg-dark-charcoal border border-card-border p-2.5 rounded-lg text-sm mt-1 focus:border-neon-lime outline-none"
              />
            </div>
            <div>
              <label className="text-xs font-semibold text-gray-400">Anon Public Key</label>
              <input 
                type="text" 
                placeholder="eyJhbGciOi..." 
                value={key} 
                onChange={e => setKey(e.target.value.trim())}
                className="w-full bg-dark-charcoal border border-card-border p-2.5 rounded-lg text-sm mt-1 focus:border-neon-lime outline-none"
              />
            </div>
            <button 
              onClick={() => { if(url && key) onSave(url, key); }}
              className="w-full py-3 bg-neon-lime text-dark-charcoal font-black rounded-xl hover:opacity-90"
            >
              Save & Launch Pitchaton
            </button>
          </div>
        </div>
      );
  }    // --- HOME VIEW ---
    function HomeView({ setView, user }) {
      return (
        <div className="space-y-16 py-8 text-center">
          <div className="space-y-6 max-w-3xl mx-auto">
            <span className="bg-neon-lime/10 border border-neon-lime/30 text-neon-lime px-4 py-1 rounded-full text-xs font-bold uppercase tracking-wide">
              ICT Hub Semester Competition
            </span>
            <h1 className="text-4xl sm:text-6xl font-black leading-tight tracking-tight">
              PITCH<span className="text-neon-lime">ATON</span>
            </h1>
            <p className="text-gray-400 text-sm sm:text-base leading-relaxed">
              The central platform for student startups and innovations at the ICT Hub. Submit your semester pitch, track evaluations, and reach the top of the leaderboard.
            </p>
            <div className="flex flex-wrap justify-center gap-4 pt-4">
              <button 
                onClick={() => setView(user ? (isAdmin(user.email) ? 'admin' : 'submit') : 'auth')}
                className="bg-neon-lime text-dark-charcoal font-bold px-8 py-3 rounded-xl glow-effect text-sm sm:text-base"
              >
                {user ? 'Go to Submissions' : 'Get Started'}
              </button>
              <button 
                onClick={() => setView('leaderboard')}
                className="bg-card-bg border border-card-border hover:border-gray-500 text-white font-semibold px-8 py-3 rounded-xl text-sm sm:text-base"
              >
                View Leaderboard
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-3 gap-6 max-w-4xl mx-auto text-left">
            <div className="p-6 bg-card-bg border border-card-border rounded-2xl">
              <div className="text-neon-lime font-black text-2xl mb-2">01</div>
              <h3 className="font-bold text-lg mb-1">Submit Idea</h3>
              <p className="text-xs text-gray-400">Provide team details, pitch deck, description, and target category.</p>
            </div>
            <div className="p-6 bg-card-bg border border-card-border rounded-2xl">
              <div className="text-neon-lime font-black text-2xl mb-2">02</div>
              <h3 className="font-bold text-lg mb-1">Review & Stage</h3>
              <p className="text-xs text-gray-400">ICT Hub faculty evaluate submissions and qualify top projects for finals.</p>
            </div>
            <div className="p-6 bg-card-bg border border-card-border rounded-2xl">
              <div className="text-neon-lime font-black text-2xl mb-2">03</div>
              <h3 className="font-bold text-lg mb-1">Win & Spotlights</h3>
              <p className="text-xs text-gray-400">Public leaderboard reveals ranks, scores, notes, and Hub features.</p>
            </div>
          </div>
        </div>
      );
    }

    // --- AUTH VIEW ---
    function AuthView({ onDone, showToast }) {
      const [isSignUp, setIsSignUp] = useState(false);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);

      const handleAuth = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          if (isSignUp) {
            const { error } = await supabase.auth.signUp({ email, password });
            if (error) throw error;
            showToast('Account created! Logging you in...', 'success');
            const { error: err2 } = await supabase.auth.signInWithPassword({ email, password });
            if (err2) throw err2;
          } else {
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;
            showToast('Logged in successfully', 'success');
          }
          onDone();
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="max-w-md mx-auto bg-card-bg border border-card-border p-8 rounded-2xl space-y-6">
          <div className="text-center">
            <h2 className="text-2xl font-black">{isSignUp ? 'Create Account' : 'Welcome Back'}</h2>
            <p className="text-xs text-gray-400 mt-1">Admin email: <code className="text-neon-lime">{ADMIN_EMAIL}</code></p>
          </div>

          <form onSubmit={handleAuth} className="space-y-4">
            <div>
              <label className="text-xs text-gray-400">Email Address</label>
              <input 
                type="email" 
                required 
                value={email} 
                onChange={e => setEmail(e.target.value)} 
                className="w-full bg-dark-charcoal border border-card-border p-3 rounded-xl text-sm mt-1 focus:border-neon-lime outline-none"
              />
            </div>
            <div>
              <label className="text-xs text-gray-400">Password</label>
              <input 
                type="password" 
                required 
                value={password} 
                onChange={e => setPassword(e.target.value)} 
                className="w-full bg-dark-charcoal border border-card-border p-3 rounded-xl text-sm mt-1 focus:border-neon-lime outline-none"
              />
            </div>
            <button 
              type="submit" 
              disabled={loading}
              className="w-full py-3 bg-neon-lime text-dark-charcoal font-bold rounded-xl"
            >
              {loading ? 'Processing...' : (isSignUp ? 'Sign Up' : 'Log In')}
            </button>
          </form>

          <p className="text-xs text-center text-gray-400">
            {isSignUp ? 'Already have an account?' : "Don't have an account?"}{' '}
            <button onClick={() => setIsSignUp(!isSignUp)} className="text-neon-lime font-bold underline ml-1">
              {isSignUp ? 'Log In' : 'Sign Up'}
            </button>
          </p>
        </div>
      );
    }

    // --- SUBMISSION VIEW ---
    function SubmitView({ user, setView, showToast, settings }) {
      const [title, setTitle] = useState('');
      const [category, setCategory] = useState('');
      const [description, setDescription] = useState('');
      const [founders, setFounders] = useState([{ name: '', email: user?.email || '', phone: '', school_year: '' }]);
      const [loading, setLoading] = useState(false);

      if (settings && !settings.submission_enabled) {
        return (
          <div className="text-center p-8 bg-card-bg border border-card-border rounded-2xl max-w-lg mx-auto">
            <h2 className="text-xl font-bold text-red-400 mb-2">Submissions Closed</h2>
            <p className="text-xs text-gray-400">The administrator has currently disabled new pitch submissions.</p>
          </div>
        );
      }

      const addFounder = () => setFounders([...founders, { name: '', email: '', phone: '', school_year: '' }]);
      const removeFounder = (idx) => setFounders(founders.filter((_, i) => i !== idx));
      const updateFounder = (idx, field, val) => {
        const next = [...founders];
        next[idx][field] = val;
        setFounders(next);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          const { data: pitch, error: pErr } = await supabase.from('pitches').insert({
            title,
            category,
            description,
            created_by: user.id,
            status: 'submitted'
          }).select().single();

          if (pErr) throw pErr;

          if (founders.length > 0) {
            const foundersData = founders.map(f => ({
              pitch_id: pitch.id,
              name: f.name || 'Member',
              email: f.email || user.email,
              phone: f.phone || null,
              school_year: f.school_year || null
            }));
            const { error: fErr } = await supabase.from('founders').insert(foundersData);
            if (fErr) throw fErr;
          }

          showToast('Pitch submitted successfully!', 'success');
          setView('dashboard');
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="max-w-2xl mx-auto bg-card-bg border border-card-border p-6 sm:p-8 rounded-2xl space-y-6">
          <h2 className="text-2xl font-black">Submit Your Pitch</h2>
          <form onSubmit={handleSubmit} className="space-y-6">
            <div className="space-y-4">
              <div>
                <label className="text-xs text-gray-400">Pitch Title *</label>
                <input 
                  required 
                  value={title} 
                  onChange={e => setTitle(e.target.value)} 
                  placeholder="e.g., Campus Autonomous Shuttle" 
                  className="w-full bg-dark-charcoal border border-card-border p-3 rounded-xl text-sm mt-1 focus:border-neon-lime outline-none"
                />
              </div>
              <div>
                <label className="text-xs text-gray-400">Category / Domain</label>
                <input 
                  value={category} 
                  onChange={e => setCategory(e.target.value)} 
                  placeholder="e.g., EdTech, AI, IoT, FinTech" 
                  className="w-full bg-dark-charcoal border border-card-border p-3 rounded-xl text-sm mt-1 focus:border-neon-lime outline-none"
                />
              </div>
              <div>
                <label className="text-xs text-gray-400">Pitch Summary & Problem Solved *</label>
                <textarea 
                  required 
                  rows={4} 
                  value={description} 
                  onChange={e => setDescription(e.target.value)} 
                  placeholder="Explain the problem, proposed solution, technology stack, and impact..." 
                  className="w-full bg-dark-charcoal border border-card-border p-3 rounded-xl text-sm mt-1 focus:border-neon-lime outline-none"
                />
              </div>
            </div>

            <div className="space-y-3 pt-4 border-t border-card-border">
              <div className="flex justify-between items-center">
                <h3 className="font-bold text-sm text-neon-lime">Founders & Team Members</h3>
                <button 
                  type="button" 
                  onClick={addFounder} 
                  className="text-xs bg-dark-charcoal border border-card-border px-3 py-1 rounded-lg text-white"
                >
                  + Add Member
                </button>
              </div>

              {founders.map((f, i) => (
                <div key={i} className="p-4 bg-dark-charcoal border border-card-border rounded-xl space-y-3 relative">
                  {founders.length > 1 && (
                    <button 
                      type="button" 
                      onClick={() => removeFounder(i)} 
                      className="absolute top-2 right-2 text-xs text-red-400"
                    >
                      Remove
                    </button>
                  )}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <input 
                      placeholder="Full Name *" 
                      required 
                      value={f.name} 
                      onChange={e => updateFounder(i, 'name', e.target.value)} 
                      className="bg-card-bg border border-card-border p-2 rounded-lg text-xs"
                    />
                    <input 
                      placeholder="Email *" 
                      required 
                      type="email" 
                      value={f.email} 
                      onChange={e => updateFounder(i, 'email', e.target.value)} 
                      className="bg-card-bg border border-card-border p-2 rounded-lg text-xs"
                    />
                    <input 
                      placeholder="Phone" 
                      value={f.phone} 
                      onChange={e => updateFounder(i, 'phone', e.target.value)} 
                      className="bg-card-bg border border-card-border p-2 rounded-lg text-xs"
                    />
                    <input 
                      placeholder="Year (e.g. Sophomore)" 
                      value={f.school_year} 
                      onChange={e => updateFounder(i, 'school_year', e.target.value)} 
                      className="bg-card-bg border border-card-border p-2 rounded-lg text-xs"
                    />
                  </div>
                </div>
              ))}
            </div>

            <button 
              type="submit" 
              disabled={loading} 
              className="w-full py-3.5 bg-neon-lime text-dark-charcoal font-black rounded-xl"
            >
              {loading ? 'Submitting...' : 'Submit Pitch Application'}
            </button>
          </form>
        </div>
      );
  }    // --- FOUNDER DASHBOARD ---
    function DashboardView({ user, setView }) {
      const [pitches, setPitches] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        if (!user) return;
        supabase.from('pitches')
          .select('*, founders(*)')
          .eq('created_by', user.id)
          .then(({ data }) => {
            if (data) setPitches(data);
            setLoading(false);
          });
      }, [user]);

      if (loading) return <div className="text-center py-12 text-sm text-gray-400">Loading your submissions...</div>;

      return (
        <div className="space-y-6">
          <div className="flex justify-between items-center">
            <h2 className="text-2xl font-black">Founder Dashboard</h2>
            <button onClick={() => setView('submit')} className="bg-neon-lime text-dark-charcoal font-bold text-xs px-3 py-2 rounded-lg">+ New Pitch</button>
          </div>

          {pitches.length === 0 ? (
            <div className="p-8 text-center bg-card-bg border border-card-border rounded-2xl space-y-4">
              <p className="text-gray-400 text-sm">You haven't submitted any pitches yet.</p>
              <button onClick={() => setView('submit')} className="bg-neon-lime text-dark-charcoal font-bold px-4 py-2 rounded-lg text-xs">Create Submission</button>
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {pitches.map(p => (
                <div key={p.id} className="p-6 bg-card-bg border border-card-border rounded-2xl space-y-4">
                  <div className="flex justify-between items-start">
                    <div>
                      <h3 className="font-bold text-lg">{p.title}</h3>
                      <span className="text-xs text-gray-400">{p.category || 'General'}</span>
                    </div>
                    <span className="px-2.5 py-1 text-xs rounded-full font-bold uppercase tracking-wider bg-neon-lime/10 border border-neon-lime/30 text-neon-lime">
                      {p.status.replace('_', ' ')}
                    </span>
                  </div>
                  <p className="text-xs text-gray-300 line-clamp-3">{p.description}</p>
                  <div className="pt-2 border-t border-card-border text-xs text-gray-400">
                    <strong>Team ({p.founders?.length || 0}):</strong> {p.founders?.map(f => f.name).join(', ') || 'None'}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // --- LEADERBOARD VIEW ---
    function LeaderboardView({ settings }) {
      const [results, setResults] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        if (!settings?.results_published) {
          setLoading(false);
          return;
        }
        supabase.from('results')
          .select('*, pitch:pitches(title, category)')
          .order('rank', { ascending: true })
          .then(({ data }) => {
            if (data) setResults(data);
            setLoading(false);
          });
      }, [settings]);

      if (loading) return <div className="text-center py-12 text-sm text-gray-400">Loading leaderboard...</div>;

      if (!settings?.results_published) {
        return (
          <div className="p-12 text-center bg-card-bg border border-card-border rounded-2xl max-w-lg mx-auto space-y-2">
            <h2 className="text-xl font-bold">Results Pending</h2>
            <p className="text-xs text-gray-400">Competition evaluations are in progress. Results will show once published by the ICT Hub admin.</p>
          </div>
        );
      }

      return (
        <div className="space-y-8 max-w-4xl mx-auto">
          <div className="text-center space-y-2">
            <h2 className="text-3xl font-black">Official Standings</h2>
            <p className="text-xs text-gray-400">ICT Hub Semester Pitch Competition Winners</p>
          </div>

          <div className="bg-card-bg border border-card-border rounded-2xl overflow-hidden">
            <table className="w-full text-left text-sm">
              <thead className="border-b border-card-border text-xs uppercase text-gray-400 bg-dark-charcoal/50">
                <tr>
                  <th className="p-4">Rank</th>
                  <th className="p-4">Pitch Title</th>
                  <th className="p-4">Category</th>
                  <th className="p-4">Score</th>
                  <th className="p-4">Notes</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-card-border">
                {results.map((r, idx) => (
                  <tr key={r.id} className={idx < 3 ? 'bg-neon-lime/5 font-semibold' : ''}>
                    <td className="p-4 text-neon-lime font-black">
                      {r.rank === 1 ? '🥇 #1' : r.rank === 2 ? '🥈 #2' : r.rank === 3 ? '🥉 #3' : `#${r.rank}`}
                    </td>
                    <td className="p-4 text-white">{r.pitch?.title || 'Unknown'}</td>
                    <td className="p-4 text-gray-400 text-xs">{r.pitch?.category || '—'}</td>
                    <td className="p-4 text-neon-lime">{r.score ?? '—'}</td>
                    <td className="p-4 text-xs text-gray-400">{r.notes || '—'}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // --- NEWS FEED VIEW ---
    function NewsView() {
      const [news, setNews] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        supabase.from('hub_news').select('*').order('published_at', { ascending: false })
          .then(({ data }) => {
            if (data) setNews(data);
            setLoading(false);
          });
      }, []);

      if (loading) return <div className="text-center py-12 text-sm text-gray-400">Loading announcements...</div>;

      return (
        <div className="space-y-6 max-w-4xl mx-auto">
          <h2 className="text-2xl font-black">Hub Announcements & Spotlights</h2>
          {news.length === 0 ? (
            <div className="p-8 text-center bg-card-bg border border-card-border rounded-2xl text-xs text-gray-400">
              No news items published yet.
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              {news.map(n => (
                <div key={n.id} className="bg-card-bg border border-card-border p-6 rounded-2xl space-y-3">
                  <span className="text-[10px] text-neon-lime font-bold uppercase tracking-wider">
                    {new Date(n.published_at).toLocaleDateString()}
                  </span>
                  <h3 className="font-bold text-lg">{n.title}</h3>
                  <p className="text-xs text-gray-300 whitespace-pre-wrap leading-relaxed">{n.content}</p>
                </div>
              ))}
            </div>
          )}
        </div>
      );
  }    // --- ADMIN PANEL (Pitches, Results, News, Settings) ---
    function AdminView({ user, showToast }) {
      const [tab, setTab] = useState('pitches');
      const [pitches, setPitches] = useState([]);
      const [results, setResults] = useState([]);
      const [settings, setSettings] = useState(null);

      const loadData = async () => {
        const { data: p } = await supabase.from('pitches').select('*, founders(*)').order('created_at', { ascending: false });
        if (p) setPitches(p);
        const { data: r } = await supabase.from('results').select('*, pitch:pitches(title)').order('rank');
        if (r) setResults(r);
        const { data: s } = await supabase.from('admin_settings').select('*').single();
        if (s) setSettings(s);
      };

      useEffect(() => { loadData(); }, []);

      const updatePitchStatus = async (id, status) => {
        const { error } = await supabase.from('pitches').update({ status }).eq('id', id);
        if (error) showToast(error.message, 'error');
        else { showToast(`Status updated to ${status}`, 'success'); loadData(); }
      };

      const exportCSV = () => {
        const headers = ['Title,Category,Status,Founders,Date\n'];
        const rows = pitches.map(p => 
          `"${p.title}","${p.category || ''}","${p.status}","${p.founders?.map(f => f.name).join(';') || ''}","${p.created_at}"`
        );
        const blob = new Blob([headers + rows.join('\n')], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `pitchaton-submissions-${Date.now()}.csv`;
        a.click();
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-wrap justify-between items-center gap-4">
            <div>
              <h2 className="text-2xl font-black">Admin Management</h2>
              <p className="text-xs text-gray-400">Authenticated: {user.email}</p>
            </div>
            <div className="flex gap-2">
              <button onClick={() => setTab('pitches')} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${tab === 'pitches' ? 'bg-neon-lime text-dark-charcoal' : 'bg-card-bg'}`}>Pitches</button>
              <button onClick={() => setTab('results')} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${tab === 'results' ? 'bg-neon-lime text-dark-charcoal' : 'bg-card-bg'}`}>Results</button>
              <button onClick={() => setTab('news')} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${tab === 'news' ? 'bg-neon-lime text-dark-charcoal' : 'bg-card-bg'}`}>News</button>
              <button onClick={() => setTab('settings')} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${tab === 'settings' ? 'bg-neon-lime text-dark-charcoal' : 'bg-card-bg'}`}>Settings</button>
            </div>
          </div>

          {tab === 'pitches' && (
            <div className="space-y-4">
              <div className="flex justify-between items-center">
                <span className="text-xs text-gray-400 font-bold">{pitches.length} Submissions</span>
                <button onClick={exportCSV} className="bg-card-bg border border-card-border text-xs px-3 py-1.5 rounded-lg">Export CSV</button>
              </div>
              <div className="bg-card-bg border border-card-border rounded-2xl overflow-x-auto">
                <table className="w-full text-left text-xs">
                  <thead className="border-b border-card-border bg-dark-charcoal/50 text-gray-400">
                    <tr>
                      <th className="p-3">Title</th>
                      <th className="p-3">Category</th>
                      <th className="p-3">Team</th>
                      <th className="p-3">Status</th>
                      <th className="p-3">Action</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-card-border">
                    {pitches.map(p => (
                      <tr key={p.id}>
                        <td className="p-3 font-bold">{p.title}</td>
                        <td className="p-3 text-gray-400">{p.category || '—'}</td>
                        <td className="p-3 text-gray-400">{p.founders?.map(f => f.name).join(', ') || '1'}</td>
                        <td className="p-3">
                          <span className="text-[10px] font-bold uppercase text-neon-lime">{p.status}</span>
                        </td>
                        <td className="p-3">
                          <select 
                            value={p.status} 
                            onChange={e => updatePitchStatus(p.id, e.target.value)} 
                            className="bg-dark-charcoal border border-card-border text-[11px] p-1 rounded"
                          >
                            <option value="submitted">Submitted</option>
                            <option value="under_review">Under Review</option>
                            <option value="accepted">Accepted</option>
                            <option value="finalist">Finalist</option>
                            <option value="winner">Winner</option>
                            <option value="rejected">Rejected</option>
                          </select>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {tab === 'results' && (
            <AdminResultsSection pitches={pitches} results={results} reload={loadData} showToast={showToast} />
          )}

          {tab === 'news' && (
            <AdminNewsSection reload={loadData} showToast={showToast} />
          )}

          {tab === 'settings' && (
            <AdminSettingsSection settings={settings} reload={loadData} showToast={showToast} />
          )}
        </div>
      );
    }

    function AdminResultsSection({ pitches, results, reload, showToast }) {
      const [pitchId, setPitchId] = useState('');
      const [rank, setRank] = useState('');
      const [score, setScore] = useState('');
      const [notes, setNotes] = useState('');

      const saveResult = async (e) => {
        e.preventDefault();
        const { error } = await supabase.from('results').upsert({
          pitch_id: pitchId,
          rank: parseInt(rank),
          score: score ? parseFloat(score) : null,
          notes: notes || null
        }, { onConflict: 'pitch_id' });

        if (error) showToast(error.message, 'error');
        else { showToast('Saved ranking', 'success'); reload(); }
      };

      const deleteResult = async (id) => {
        await supabase.from('results').delete().eq('id', id);
        reload();
      };

      return (
        <div className="space-y-6">
          <form onSubmit={saveResult} className="p-4 bg-card-bg border border-card-border rounded-xl grid grid-cols-1 sm:grid-cols-4 gap-3 text-xs">
            <select required value={pitchId} onChange={e => setPitchId(e.target.value)} className="bg-dark-charcoal border border-card-border p-2 rounded-lg">
              <option value="">Select Pitch...</option>
              {pitches.map(p => <option key={p.id} value={p.id}>{p.title}</option>)}
            </select>
            <input required type="number" placeholder="Rank (1, 2, 3...)" value={rank} onChange={e => setRank(e.target.value)} className="bg-dark-charcoal border border-card-border p-2 rounded-lg"/>
            <input type="number" step="0.1" placeholder="Score (optional)" value={score} onChange={e => setScore(e.target.value)} className="bg-dark-charcoal border border-card-border p-2 rounded-lg"/>
            <button type="submit" className="bg-neon-lime text-dark-charcoal font-bold p-2 rounded-lg">Save Rank</button>
          </form>

          <div className="bg-card-bg border border-card-border rounded-xl p-4 space-y-2">
            <h4 className="font-bold text-xs text-gray-400">Current Standings</h4>
            {results.map(r => (
              <div key={r.id} className="flex justify-between items-center p-2 bg-dark-charcoal rounded-lg text-xs">
                <span><strong>#{r.rank}</strong> {r.pitch?.title} (Score: {r.score ?? 'N/A'})</span>
                <button onClick={() => deleteResult(r.id)} className="text-red-400">Delete</button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function AdminNewsSection({ reload, showToast }) {
      const [title, setTitle] = useState('');
      const [content, setContent] = useState('');

      const postNews = async (e) => {
        e.preventDefault();
        const { error } = await supabase.from('hub_news').insert({ title, content });
        if (error) showToast(error.message, 'error');
        else { showToast('News posted', 'success'); setTitle(''); setContent(''); reload(); }
      };

      return (
        <form onSubmit={postNews} className="p-6 bg-card-bg border border-card-border rounded-2xl space-y-4 max-w-xl">
          <h3 className="font-bold text-sm">Post Announcement</h3>
          <input required placeholder="Announcement Title" value={title} onChange={e => setTitle(e.target.value)} className="w-full bg-dark-charcoal border border-card-border p-2.5 rounded-lg text-xs" />
          <textarea required rows={4} placeholder="Content body..." value={content} onChange={e => setContent(e.target.value)} className="w-full bg-dark-charcoal border border-card-border p-2.5 rounded-lg text-xs" />
          <button type="submit" className="w-full py-2.5 bg-neon-lime text-dark-charcoal font-bold text-xs rounded-lg">Publish News</button>
        </form>
      );
    }

    function AdminSettingsSection({ settings, reload, showToast }) {
      const updateSetting = async (field, value) => {
        const { error } = await supabase.from('admin_settings').update({ [field]: value }).eq('id', settings.id);
        if (error) showToast(error.message, 'error');
        else { showToast('Setting updated', 'success'); reload(); }
      };

      if (!settings) return null;

      return (
        <div className="p-6 bg-card-bg border border-card-border rounded-2xl space-y-4 max-w-xl text-xs">
          <div className="flex justify-between items-center p-3 bg-dark-charcoal rounded-xl">
            <div>
              <p className="font-bold">Allow Submissions</p>
              <p className="text-gray-400 text-[10px]">Founders can submit new pitches</p>
            </div>
            <button 
              onClick={() => updateSetting('submission_enabled', !settings.submission_enabled)}
              className={`px-3 py-1.5 rounded-lg font-bold ${settings.submission_enabled ? 'bg-neon-lime text-dark-charcoal' : 'bg-red-500/20 text-red-400'}`}
            >
              {settings.submission_enabled ? 'ON' : 'OFF'}
            </button>
          </div>

          <div className="flex justify-between items-center p-3 bg-dark-charcoal rounded-xl">
            <div>
              <p className="font-bold">Publish Public Leaderboard</p>
              <p className="text-gray-400 text-[10px]">Show results and rankings to all users</p>
            </div>
            <button 
              onClick={() => updateSetting('results_published', !settings.results_published)}
              className={`px-3 py-1.5 rounded-lg font-bold ${settings.results_published ? 'bg-neon-lime text-dark-charcoal' : 'bg-red-500/20 text-red-400'}`}
            >
              {settings.results_published ? 'PUBLISHED' : 'HIDDEN'}
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
